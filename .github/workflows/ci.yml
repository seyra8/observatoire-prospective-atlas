# ════════════════════════════════════════════════════════════════════════════
# CI — Observatoire Prospective Atlas (mode minimal v0.3)
# ════════════════════════════════════════════════════════════════════════════
# Le vrai build + déploiement est fait par Vercel automatiquement à chaque push.
# Vercel vérifie déjà : npm install + next build + déploiement.
# Son statut apparaît dans les PR GitHub (commentaire automatique Vercel bot).
#
# Cette CI GitHub Actions sert pour l'instant juste à :
#   • ne pas bloquer Dependabot (ses PR passent au vert)
#   • avoir un workflow qui se déclenche (onboarding visuel)
#
# TODO (plus tard, v0.4) : réactiver typecheck + build + audit axe-core.
# Voir archive dans git history du commit "ci: GitHub Actions + Dependabot".
# ════════════════════════════════════════════════════════════════════════════

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  status:
    name: Statut du projet
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v6

      - name: Rappel — Vercel est la source de vérité pour les builds
        run: |
          echo "✅ Le build Next.js et le déploiement sont gérés par Vercel."
          echo ""
          echo "Statut Vercel : voir le commentaire automatique dans la PR (bot Vercel)"
          echo "ou l'URL preview : observatoire-prospective-atlas.vercel.app"
          echo ""
          echo "TODO v0.4 : réactiver ici :"
          echo "  • npm run typecheck  (détecter erreurs TS non vues par Vercel)"
          echo "  • audit axe-core     (accessibilité automatisée)"
          echo "  • npm audit          (vulnérabilités — déjà via Dependabot)"
